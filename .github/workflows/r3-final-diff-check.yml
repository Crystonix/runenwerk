name: R3 final diff check

on:
  push:
    branches:
      - issue-475-r3-representations

permissions:
  contents: write

concurrency:
  group: r3-final-diff-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Produce clean final head and verify diff
        shell: bash
        run: |
          set -euo pipefail
          base=30847913ea386e16a89cb9a02b7533b5670490a5
          candidate=94123b0165e2a89181b3f260cd34900d4f8bb803
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git merge-base "$base" HEAD)" = "$base"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r3-final-diff-check.yml
          git commit -m "ci: remove temporary R3 final diff check"
          clean_head="$(git rev-parse HEAD)"
          git push origin HEAD:issue-475-r3-representations

          git diff --check "$base".."$clean_head"

          expected=$'engine/src/plugins/mod.rs\nengine/src/plugins/render/appearance.rs\nengine/src/plugins/render/mod.rs\nengine/src/plugins/render/participation.rs\nengine/src/plugins/render/representation.rs\nengine/src/plugins/render/scene/mod.rs\nengine/src/plugins/render/surface_result.rs\nengine/src/plugins/runenrender_r3_proof_tests.rs'
          actual="$(git diff --name-only "$base".."$clean_head")"
          test "$actual" = "$expected"
          if git ls-tree -r --name-only "$clean_head" | grep -Fxq '.github/workflows/r3-final-diff-check.yml'; then
            echo 'temporary workflow survived cleanup' >&2
            exit 1
          fi
          echo "FINAL_R3_HEAD=$clean_head"
          echo 'git diff --check: PASS'
