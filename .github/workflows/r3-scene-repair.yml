name: R3 scene repair

on:
  push:
    branches:
      - issue-475-r3-representations

permissions:
  contents: write

concurrency:
  group: r3-scene-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify reviewed source blob
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git hash-object engine/src/plugins/render/scene/mod.rs)"
          test "$actual" = "242b765613400dce9a919639b3cc8cbc3367412b"

      - name: Canonical stable rustfmt
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all

      - name: Apply reviewed proof corrections
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("engine/src/plugins/render/scene/mod.rs")
          text = path.read_text()

          marker = """    #[test]
              fn r3_participation_supports_multiple_representations_and_precise_change_evidence() {
          """.replace("              fn", "    fn")
          if text.count(marker) != 1:
              raise SystemExit("R3 participation insertion marker was not unique")

          exhaustion = """    #[test]
              fn representation_allocator_exhaustion_is_explicit_and_revision_neutral() {
                  let mut store = RenderSceneStore::new();
                  let owner = store.allocate_object_id().expect("object ID");
                  let revision = store.revision();
                  store.next_representation_raw = u64::MAX;

                  assert_eq!(
                      store.allocate_representation_id(owner),
                      Err(RenderRepresentationIdAllocationError::Exhausted)
                  );
                  assert_eq!(store.revision(), revision);
                  assert!(store.representation_owners.is_empty());
              }

          """
          exhaustion = "\n".join(line[10:] if line.startswith("          ") else line for line in exhaustion.splitlines()) + "\n"
          text = text.replace(marker, exhaustion + marker, 1)

          pattern = re.compile(
              r"    #\[test\]\n"
              r"    fn invalid_r3_operation_rejects_multi_object_update_without_partial_publication\(\) \{.*?"
              r"(?=\n    #\[test\]\n    fn retained_snapshot_preserves_prior_r3_participation)",
              re.S,
          )
          replacement = """    #[test]
              fn duplicate_same_object_r3_replacement_rejects_without_publication() {
                  let mut store = RenderSceneStore::new();
                  let object_id = store.allocate_object_id().expect("object ID");
                  insert_one(&mut store, object_id);
                  let representation = surface_representation(&mut store, object_id);
                  let participation = RenderObjectParticipation::new(vec![representation], None, None)
                      .expect("valid state");
                  let before = store.snapshot();

                  let mut update = RenderSceneUpdate::new();
                  update
                      .replace_participation(object_id, participation.clone())
                      .replace_participation(object_id, participation);
                  assert_eq!(
                      store.commit(update),
                      Err(RenderSceneCommitError::ConflictingOperations { object_id })
                  );
                  assert_eq!(store.snapshot(), before);
              }
          """
          replacement = "\n".join(line[10:] if line.startswith("          ") else line for line in replacement.splitlines())
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("misleading R3 conflict test replacement did not match exactly once")

          path.write_text(text)

      - name: Reformat and verify exact final blob
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable fmt --all
          git diff --check
          actual="$(git hash-object engine/src/plugins/render/scene/mod.rs)"
          test "$actual" = "0d5c7c557007c0dedd1349b3ffc404d396523769"

      - name: Publish verified scene blob
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/src/plugins/render/scene/mod.rs
          git diff --cached --quiet && exit 0
          git commit -m "RunenRender R3: canonicalize scene proofs"
          git push origin HEAD:issue-475-r3-representations
