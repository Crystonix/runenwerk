name: R3 surface result repair

on:
  push:
    branches:
      - issue-475-r3-representations

permissions:
  contents: write

concurrency:
  group: r3-surface-result-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify reviewed source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object engine/src/plugins/render/representation.rs)" = "ee33fd69e572d004545e30ed9509dc0dc84100b8"
          test "$(git hash-object engine/src/plugins/render/surface_result.rs)" = "aa94c57acb05e5207c052489f7ec60485871f1d4"

      - name: Repair result ownership
        shell: python
        run: |
          from pathlib import Path
          import re

          representation_path = Path("engine/src/plugins/render/representation.rs")
          representation = representation_path.read_text()

          hit_pattern = re.compile(
              r"\n#\[derive\(Debug, Clone, Copy, PartialEq, Eq, Hash\)\]\n"
              r"pub struct RenderSurfaceHit \{.*?\n\}\n\n"
              r"impl RenderSurfaceHit \{.*?\n\}\n"
              r"(?=\n#\[derive\(Debug, Clone, Copy, PartialEq, Eq, Hash\)\]\n"
              r"pub struct RenderFieldDistanceQuery)",
              re.S,
          )
          representation, count = hit_pattern.subn("\n", representation, count=1)
          if count != 1:
              raise SystemExit("RenderSurfaceHit authority block did not match exactly once")

          test_pattern = re.compile(
              r"    #\[test\]\n"
              r"    fn exact_analytic_surface_protocol_has_narrow_query_and_result\(\) \{.*?"
              r"(?=\n    #\[test\]\n    fn conservative_field_protocol_exposes_bounded_safe_distance_evidence)",
              re.S,
          )
          replacement = '''    #[test]
    fn exact_analytic_surface_protocol_has_narrow_query_and_result() {
        use crate::plugins::render::surface_result::RenderSurfaceQueryResult;

        let record = representation(
            1,
            Some(
                RenderSurfaceProtocolEvidence::exact(RENDER_SURFACE_QUERY_PROTOCOL_REVISION)
                    .expect("valid protocol"),
            ),
            None,
        );
        record
            .surface_query_protocol(RENDER_SURFACE_QUERY_PROTOCOL_REVISION)
            .expect("surface protocol should be supported");
        let query = RenderSurfaceQuery::new([0.0, 0.0, 3.0], [0.0, 0.0, -2.0], instant())
            .expect("valid query");

        // R3 protocol proof fixture: exact unit sphere at the scene origin. The fixture is deliberately
        // test-local; the public protocol is not named after or coupled to the founding primitive.
        let origin = query.origin_scene_meters();
        let direction = query.direction_scene();
        let b = origin[0] * direction[0] + origin[1] * direction[1] + origin[2] * direction[2];
        let c = origin[0] * origin[0] + origin[1] * origin[1] + origin[2] * origin[2] - 1.0;
        let distance = -b - (b * b - c).sqrt();
        let result = RenderSurfaceQueryResult::hit_at_distance(query, distance)
            .expect("valid exact hit result");
        let hit = result.hit().expect("surface should hit");
        assert_eq!(hit.distance_meters(), 2.0);
        assert_eq!(hit.position_scene_meters(), [0.0, 0.0, 1.0]);
    }
'''
          representation, count = test_pattern.subn(replacement, representation, count=1)
          if count != 1:
              raise SystemExit("analytic surface proof did not match exactly once")
          representation_path.write_text(representation)

          result_path = Path("engine/src/plugins/render/surface_result.rs")
          result = result_path.read_text()
          result = result.replace(
              "use super::representation::{\n    RenderRepresentationValidationError, RenderSurfaceHit, RenderSurfaceQuery,\n};\n",
              "use super::representation::{RenderRepresentationValidationError, RenderSurfaceQuery};\nuse super::space_time::CanonicalF64;\n",
              1,
          )
          marker = "#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]\npub struct RenderSurfaceQueryResult {"
          if result.count(marker) != 1:
              raise SystemExit("surface result insertion marker was not unique")
          hit_type = '''#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]
pub struct RenderSurfaceHit {
    distance_meters: CanonicalF64,
    position_scene_meters: [CanonicalF64; 3],
}

impl RenderSurfaceHit {
    fn from_query_distance(
        query: RenderSurfaceQuery,
        distance_meters: f64,
    ) -> Result<Self, RenderRepresentationValidationError> {
        let distance_meters = CanonicalF64::new(distance_meters, "surface_hit_distance_meters")?;
        if distance_meters.get() < 0.0 {
            return Err(RenderRepresentationValidationError::NegativeSurfaceHitDistance);
        }
        let origin = query.origin_scene_meters();
        let direction = query.direction_scene();
        let distance = distance_meters.get();
        let position = [
            origin[0] + direction[0] * distance,
            origin[1] + direction[1] * distance,
            origin[2] + direction[2] * distance,
        ];
        Ok(Self {
            distance_meters,
            position_scene_meters: [
                CanonicalF64::new(position[0], "surface_hit_position_scene_meters")?,
                CanonicalF64::new(position[1], "surface_hit_position_scene_meters")?,
                CanonicalF64::new(position[2], "surface_hit_position_scene_meters")?,
            ],
        })
    }

    pub fn distance_meters(self) -> f64 {
        self.distance_meters.get()
    }

    pub fn position_scene_meters(self) -> [f64; 3] {
        self.position_scene_meters.map(CanonicalF64::get)
    }
}

'''
          result = result.replace(marker, hit_type + marker, 1)

          old_hit = '''        let origin = query.origin_scene_meters();
        let direction = query.direction_scene();
        let position = [
            origin[0] + direction[0] * distance_meters,
            origin[1] + direction[1] * distance_meters,
            origin[2] + direction[2] * distance_meters,
        ];
        let hit = RenderSurfaceHit::new(distance_meters, position)?;
'''
          if result.count(old_hit) != 1:
              raise SystemExit("old surface hit construction did not match exactly once")
          result = result.replace(
              old_hit,
              "        let hit = RenderSurfaceHit::from_query_distance(query, distance_meters)?;\n",
              1,
          )
          result_path.write_text(result)

      - name: Verify and publish focused repair
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all
          cargo +stable fmt --all --check
          git diff --check
          names="$(git diff --name-only)"
          test "$names" = $'engine/src/plugins/render/representation.rs\nengine/src/plugins/render/surface_result.rs'
          ! grep -q "pub fn new(.*position_scene_meters" engine/src/plugins/render/representation.rs
          grep -q "pub struct RenderSurfaceHit" engine/src/plugins/render/surface_result.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/src/plugins/render/representation.rs engine/src/plugins/render/surface_result.rs
          git commit -m "RunenRender R3: unify surface result authority"
          git push origin HEAD:issue-475-r3-representations
