name: R3 surface result repair

on:
  push:
    branches:
      - issue-475-r3-representations

permissions:
  contents: write

concurrency:
  group: r3-surface-result-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify reviewed source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object engine/src/plugins/render/representation.rs)" = "ee33fd69e572d004545e30ed9509dc0dc84100b8"
          test "$(git hash-object engine/src/plugins/render/surface_result.rs)" = "aa94c57acb05e5207c052489f7ec60485871f1d4"

      - name: Repair result ownership
        shell: python
        run: |
          from pathlib import Path
          import base64
          import re

          representation_path = Path("engine/src/plugins/render/representation.rs")
          representation = representation_path.read_text()
          hit_pattern = re.compile(r"\n#\[derive\(Debug, Clone, Copy, PartialEq, Eq, Hash\)\]\npub struct RenderSurfaceHit \{.*?\n\}\n\nimpl RenderSurfaceHit \{.*?\n\}\n(?=\n#\[derive\(Debug, Clone, Copy, PartialEq, Eq, Hash\)\]\npub struct RenderFieldDistanceQuery)", re.S)
          representation, count = hit_pattern.subn("\n", representation, count=1)
          if count != 1:
              raise SystemExit("RenderSurfaceHit authority block did not match exactly once")
          test_pattern = re.compile(r"    #\[test\]\n    fn exact_analytic_surface_protocol_has_narrow_query_and_result\(\) \{.*?(?=\n    #\[test\]\n    fn conservative_field_protocol_exposes_bounded_safe_distance_evidence)", re.S)
          test_b64 = ""
          replacement = base64.b64decode(test_b64).decode()
          representation, count = test_pattern.subn(replacement, representation, count=1)
          if count != 1:
              raise SystemExit("analytic surface proof did not match exactly once")
          representation_path.write_text(representation)

          result_path = Path("engine/src/plugins/render/surface_result.rs")
          result = result_path.read_text()
          old_import = "use super::representation::{\n    RenderRepresentationValidationError, RenderSurfaceHit, RenderSurfaceQuery,\n};\n"
          new_import = "use super::representation::{RenderRepresentationValidationError, RenderSurfaceQuery};\nuse super::space_time::CanonicalF64;\n"
          if result.count(old_import) != 1:
              raise SystemExit("surface result import block did not match exactly once")
          result = result.replace(old_import, new_import, 1)
          marker = "#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]\npub struct RenderSurfaceQueryResult {"
          if result.count(marker) != 1:
              raise SystemExit("surface result insertion marker was not unique")
          hit_b64 = ""
          hit_type = base64.b64decode(hit_b64).decode()
          result = result.replace(marker, hit_type + marker, 1)
          old_hit_pattern = re.compile(r"        let origin = query\.origin_scene_meters\(\);.*?        let hit = RenderSurfaceHit::new\(distance_meters, position\)\?;\n", re.S)
          result, count = old_hit_pattern.subn("        let hit = RenderSurfaceHit::from_query_distance(query, distance_meters)?;\n", result, count=1)
          if count != 1:
              raise SystemExit("old surface hit construction did not match exactly once")
          result_path.write_text(result)

      - name: Verify and publish focused repair
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all
          cargo +stable fmt --all --check
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --name-only | grep -Fx "engine/src/plugins/render/representation.rs"
          git diff --name-only | grep -Fx "engine/src/plugins/render/surface_result.rs"
          grep -q "pub struct RenderSurfaceHit" engine/src/plugins/render/surface_result.rs
          ! grep -q "pub struct RenderSurfaceHit" engine/src/plugins/render/representation.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/src/plugins/render/representation.rs engine/src/plugins/render/surface_result.rs
          git commit -m "RunenRender R3: unify surface result authority"
          git push origin HEAD:issue-475-r3-representations
