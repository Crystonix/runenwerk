name: R3 validation repair

on:
  push:
    branches:
      - issue-475-r3-representations

permissions:
  contents: write

concurrency:
  group: r3-validation-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify reviewed starting point
        shell: bash
        run: |
          set -euo pipefail
          base_candidate=aba096e8279ed165fdbc146b100b5204315fd93e
          test "$(git diff --name-only "$base_candidate"..HEAD)" = ".github/workflows/r3-validation-repair.yml"
          test "$(git hash-object engine/src/plugins/render/scene/mod.rs)" = "66b251daca86b5d0f24da9c0098bc8d7a8f2939f"
          test "$(git hash-object engine/src/plugins/render/representation.rs)" = "1361c2d3242332a225198da360dc3789010017de"

      - name: Apply exact validation repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          scene_path = Path("engine/src/plugins/render/scene/mod.rs")
          scene = scene_path.read_text()
          scene_pattern = re.compile(
              r"(?P<indent> +)let representations_differ = current\n"
              r"(?P=indent)    \.map\(RenderObjectParticipation::representations\)\n"
              r"(?P=indent)    != next\.map\(RenderObjectParticipation::representations\);"
          )
          scene_matches = list(scene_pattern.finditer(scene))
          if len(scene_matches) != 1:
              raise SystemExit(
                  f"scene representation-change comparison matched {len(scene_matches)} times"
              )
          match = scene_matches[0]
          indent = match.group("indent")
          replacement = (
              f"{indent}let current_representations = current\n"
              f"{indent}    .map(RenderObjectParticipation::representations)\n"
              f"{indent}    .unwrap_or(&[]);\n"
              f"{indent}let next_representations = next\n"
              f"{indent}    .map(RenderObjectParticipation::representations)\n"
              f"{indent}    .unwrap_or(&[]);\n"
              f"{indent}let representations_differ = current_representations != next_representations;"
          )
          scene = scene[: match.start()] + replacement + scene[match.end() :]
          scene_path.write_text(scene)

          representation_path = Path("engine/src/plugins/render/representation.rs")
          representation = representation_path.read_text()
          raw_pattern = re.compile(
              r"(?m)^(?P<indent> +)pub\(crate\) const fn raw\(self\) -> u64 \{\n"
              r"(?P=indent)    self\.0\.get\(\)\n"
              r"(?P=indent)\}$"
          )
          raw_matches = list(raw_pattern.finditer(representation))
          if len(raw_matches) != 1:
              raise SystemExit(f"representation raw accessor matched {len(raw_matches)} times")
          match = raw_matches[0]
          indent = match.group("indent")
          replacement = (
              f"{indent}#[cfg(test)]\n"
              f"{indent}pub(crate) const fn raw(self) -> u64 {{\n"
              f"{indent}    self.0.get()\n"
              f"{indent}}}"
          )
          representation = (
              representation[: match.start()] + replacement + representation[match.end() :]
          )
          representation_path.write_text(representation)
          PY

      - name: Validate focused repair and publish
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          cargo +stable fmt --all
          cargo +stable fmt --all --check
          cargo +stable test -p engine material_assignment_and_emitter_publish_only_their_truthful_r3_evidence --locked
          cargo +stable test -p engine material_assignment_removal_and_missing_endpoint_are_deterministic --locked
          cargo +stable clippy -p engine --lib --locked -- -D warnings
          git diff --check
          expected=$'engine/src/plugins/render/representation.rs\nengine/src/plugins/render/scene/mod.rs'
          actual="$(git diff --name-only)"
          test "$actual" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/src/plugins/render/representation.rs engine/src/plugins/render/scene/mod.rs
          git commit -m "RunenRender R3: make change evidence truthful"
          git push origin HEAD:issue-475-r3-representations
